        "404":
          description: No custom role with that id.
        "409":
          description: Base roles are immutable.
      x-permission: CIPP.Roles.ReadWrite
    delete:
      operationId: deleteRole
      summary: Delete a custom role that no user or API client is assigned.
      security:
        - bearerAuth: []
      responses:
