components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Portal user session token or API client access token.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: External API client key (EPIC-038).
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned as `nextCursor` by the previous page. Clients must treat it as opaque and must not parse it.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Defaults to 100; hard maximum is 1000.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
  schemas:
    ErrorDetail:
      type: object
      additionalProperties: true
      description: A code-specific detail entry. The `code` on the parent error is stable; detail shapes are documented per error code.
      properties:
        field:
          type: string
        reason:
          type: string
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - correlationId
      description: Structured error body (05-programming.md §3). Stable machine-readable `code`, a client-safe `message`, optional per-code `details`, and the `correlationId` used to trace the request in server logs. Never includes stack traces or secrets.
      properties:
        code:
          type: string
          description: Stable machine-readable error code, e.g. `run.not_found`.
          examples:
            - run.not_found
        message:
          type: string
          description: Human-readable message safe to show to the caller.
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
        correlationId:
          type: string
          description: Correlates the response with server logs.
    CursorPage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      description: Cursor-paginated collection. Route tickets layer typed items onto this shape with `allOf` (or `items` for a concrete collection) so pagination stays defined in exactly one place.
      properties:
        items:
          type: array
          description: The page items.
          items: {}
        nextCursor:
          type:
            - string
            - "null"
          description: Opaque cursor for the next page, or `null` when this is the last page. Clients pass it back as the `cursor` query parameter.
    PortalUser:
      type: object
      required:
        - id
        - upn
        - role
        - status
        - scope
      properties:
        id:
          type: string
        upn:
          type: string
        displayName:
          type:
            - string
            - "null"
        role:
          type: string
          enum:
            - readonly
            - editor
            - admin
            - superadmin
        status:
          type: string
          enum:
            - enabled
            - disabled
        scope:
          type: object
          required:
            - targetType
          properties:
            targetType:
              type: string
              enum:
                - tenant
                - group
                - all
            targetId:
              type:
                - string
                - "null"
        lastSeenAt:
          type:
            - string
            - "null"
        createdAt:
          type: string
        updatedAt:
          type: string
    Role:
      type: object
      required:
        - id
        - name
        - builtin
        - include
        - exclude
        - superadminOnly
      properties:
        id:
          type: string
        name:
          type: string
        builtin:
          type: boolean
        include:
          type: array
          items:
            type: string
        exclude:
          type: array
          items:
            type: string
        superadminOnly:
          type: boolean
          description: True when the role grants Remediation.Apply; only a superadmin may be assigned.
        usageCount:
          type: integer
          minimum: 0
    ApiClient:
      type: object
      required:
        - id
        - name
        - roles
        - ipRanges
        - enabled
      properties:
        id:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string
        ipRanges:
          type: array
          items:
            type: string
          description: "`Any` or a list of CIDR ranges."
        rateLimit:
          type:
            - integer
            - "null"
          minimum: 1
        enabled:
          type: boolean
        lastUsedAt:
          type:
            - string
            - "null"
        createdAt:
          type: string
        updatedAt:
          type: string
  responses:
    Error:
      description: Structured error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
