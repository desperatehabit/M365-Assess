openapi: 3.1.0
info:
  title: M365-Assess Portal API
  version: 1.0.0
  description: "Versioned portal API (ADR-0014 thin BFF). Generated from per-route metadata: route modules declare their path items and permission and this document is assembled from them, so it cannot drift from the implementation. It owns the shared error and cursor-pagination schemas, the shared query parameters, and the security schemes. External callers authenticate with OAuth client credentials against api://<appId>/.default."
servers:
  - url: /v1
    description: Versioned API root.
paths:
  /access/check:
    post:
      operationId: checkAccess
      summary: Evaluate a permission for the caller (UI preflight).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - permission
              properties:
                permission:
                  type: string
                  description: Permission to evaluate, e.g. Tenant.Read.
                tenantId:
                  type: string
                  description: Tenant to include in the scope check.
      responses:
        "200":
          description: The access decision the endpoint would enforce.
        "400":
          description: The request body is invalid.
        "401":
          description: Authentication required.
      x-permission: authenticated
  /api-clients:
    get:
      operationId: listApiClients
      responses:
        "200":
          description: Cursor-paginated API clients.
      x-permission: CIPP.ApiClients.Read
      security:
        - bearerAuth: []
    post:
      operationId: createApiClient
      summary: Create an API client; returns the plaintext secret once.
      responses:
        "201":
          description: Created; `secret` is present once.
        "400":
          description: Validation failed.
      x-permission: CIPP.ApiClients.ReadWrite
      security:
        - bearerAuth: []
  /api-clients/{id}:
    get:
      operationId: getApiClient
      responses:
        "200":
          description: Response.
        "404":
          description: Response.
      x-permission: CIPP.ApiClients.Read
      security:
        - bearerAuth: []
    patch:
      operationId: updateApiClient
      responses:
        "200":
          description: Response.
        "404":
          description: Response.
      x-permission: CIPP.ApiClients.ReadWrite
      security:
        - bearerAuth: []
    delete:
      operationId: deleteApiClient
      responses:
        "204":
          description: Response.
        "404":
          description: Response.
      x-permission: CIPP.ApiClients.ReadWrite
      security:
        - bearerAuth: []
  /api-clients/{id}/rotate-secret:
    post:
      operationId: rotateApiClientSecret
      summary: Rotate the secret; returns the new plaintext secret once.
      responses:
        "200":
          description: Response.
        "404":
